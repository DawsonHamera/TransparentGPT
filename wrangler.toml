name = "transparentgpt-pages"
compatibility_date = "2026-04-06"
compatibility_flags = ["nodejs_compat"]

# Required public env for the frontend to reach the separate API Worker.
# For Git-connected Pages deploys, also set this in the Pages dashboard env vars.
[vars]
NEXT_PUBLIC_WORKER_URL = "https://your-worker-subdomain.workers.dev"

# For Next.js on Pages (via @cloudflare/next-on-pages)
pages_build_output_dir = ".vercel/output/static"
